<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- thumbnail frame icon -->
  <rect x="5" y="9" width="22" height="15" rx="3" fill="none" stroke="white" stroke-width="2"/>
  <!-- image mountain icon inside frame -->
  <polyline points="5,20 11,14 16,18 20,13 27,20" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- T letter bottom -->
  <rect x="12" y="25" width="8" height="2" rx="1" fill="white" opacity="0.8"/>
  <rect x="15.5" y="22" width="1.5" height="5" rx="0.5" fill="white" opacity="0.8"/>
</svg>
